# SOPS читает этот файл автоматически. Все secrets*.yaml внутри helm/ шифруются
# твоим age-публичным ключом.
#
# ЗАПОЛНИ: замени плейсхолдер на СВОЙ публичный ключ из вывода age-keygen
# (строка вида age1...). Приватный ключ (age-key.txt) НИКОГДА не коммить.
creation_rules:
  - path_regex: helm/.*/secrets.*\.yaml$
    age: age15kwvytt300z2p3tygq72hp0x7hr0dzc0w60czjt80t9nq5wadqxsruw0va
