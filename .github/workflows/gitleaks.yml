name: gitleaks
on: [push, pull_request]
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужна вся история для скана
      - name: Run gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz -o gl.tar.gz
          tar -xzf gl.tar.gz gitleaks && chmod +x gitleaks
          ./gitleaks git . --config=.gitleaks.toml --redact --no-banner --exit-code 1
