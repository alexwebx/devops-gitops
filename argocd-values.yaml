# Values для установки ArgoCD:
#   helm install argocd argo/argo-cd -n argocd --version <X.Y.Z> -f argocd-values.yaml
#
# Ключевое:
#  - repoServer с плагином helm-secrets + age-ключом расшифровывает secrets:// при рендере
#  - сервисный аккаунт github-actions (для CI: argocd app sync)
#  - server за ingress-nginx с TLS (cert-manager)
#
# ЗАПОЛНИ: argocd.ВАШ_ДОМЕН.
# ⚠️  Версия чарта и точные ключи ingress валидируются на живом прогоне (см. 00-design.md).

applicationSet:
  replicas: 1

configs:
  cm:
    # Включаем схемы secrets+age-import — ArgoCD принимает зашифрованные values.
    helm.valuesFileSchemes: >-
      secrets+gpg-import, secrets+gpg-import-kubernetes, secrets+age-import,
      secrets+age-import-kubernetes, secrets, secrets+literal, https
    # Сервисный аккаунт для CI (генерирует токен argocd account generate-token).
    accounts.github-actions: apiKey
  rbac:
    # Минимальные права: только управление приложениями.
    policy.csv: |
      p, github-actions, applications, *, *, allow
  params:
    # server.insecure — ArgoCD server слушает HTTP (TLS терминирует ingress-nginx).
    server.insecure: true

controller:
  replicas: 1
  metrics:
    enabled: true

redis-ha:
  enabled: false

redis:
  enabled: true
  # Чарт по умолчанию тянет redis с ecr-public.aws.com — с бюджетных VPS туда часто
  # нет сети (ImagePullBackOff). Берём redis с Docker Hub (он и так доступен для образов).
  image:
    repository: redis
    tag: 8.2.3-alpine
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "256Mi" }

repoServer:
  metrics:
    enabled: true
  autoscaling:
    enabled: false
  extraArgs:
    - --parallelismlimit=3
  resources:
    requests: { cpu: "250m", memory: "256Mi" }
    limits: { cpu: "1", memory: "1Gi" }

  env:
    - name: HELM_PLUGINS
      value: /gitops-tools/helm-plugins/
    - name: HELM_SECRETS_CURL_PATH
      value: /gitops-tools/curl
    - name: HELM_SECRETS_SOPS_PATH
      value: /gitops-tools/sops
    - name: HELM_SECRETS_VALS_PATH
      value: /gitops-tools/vals
    - name: HELM_SECRETS_KUBECTL_PATH
      value: /gitops-tools/kubectl
    - name: HELM_SECRETS_BACKEND
      value: sops
    - name: HELM_SECRETS_VALUES_ALLOW_SYMLINKS
      value: "false"
    - name: HELM_SECRETS_VALUES_ALLOW_ABSOLUTE_PATH
      value: "true"
    - name: HELM_SECRETS_VALUES_ALLOW_PATH_TRAVERSAL
      value: "false"
    - name: HELM_SECRETS_WRAPPER_ENABLED
      value: "true"
    - name: HELM_SECRETS_DECRYPT_SECRETS_IN_TMP_DIR
      value: "true"
    - name: HELM_SECRETS_HELM_PATH
      value: /usr/local/bin/helm
    - name: SOPS_AGE_KEY_FILE
      value: /helm-secrets-private-keys/key.txt

  initContainers:
    - name: download-tools
      image: alpine:latest
      imagePullPolicy: IfNotPresent
      command: [sh, -ec]
      env:
        - name: HELM_SECRETS_VERSION
          value: "4.7.6"
        - name: KUBECTL_VERSION
          value: "1.31.4"
        - name: VALS_VERSION
          value: "0.44.4"
        - name: SOPS_VERSION
          value: "3.9.4"
      args:
        - |
          mkdir -p /gitops-tools/helm-plugins

          GO_ARCH=$(uname -m | sed -e 's/x86_64/amd64/')
          wget -qO /gitops-tools/curl https://github.com/moparisthebest/static-curl/releases/latest/download/curl-${GO_ARCH}

          GO_ARCH=$(uname -m | sed -e 's/x86_64/amd64/' -e 's/\(arm\)\(64\)\?.*/\1\2/' -e 's/aarch64$/arm64/')
          wget -qO /gitops-tools/kubectl https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/${GO_ARCH}/kubectl
          wget -qO /gitops-tools/sops https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.${GO_ARCH}
          wget -qO- https://github.com/helmfile/vals/releases/download/v${VALS_VERSION}/vals_${VALS_VERSION}_linux_${GO_ARCH}.tar.gz | tar zxv -C /gitops-tools vals
          wget -qO- https://github.com/jkroepke/helm-secrets/releases/download/v${HELM_SECRETS_VERSION}/helm-secrets.tar.gz | tar -C /gitops-tools/helm-plugins -xzf-

          chmod +x /gitops-tools/*
          cp /gitops-tools/helm-plugins/helm-secrets/scripts/wrapper/helm.sh /gitops-tools/helm
      volumeMounts:
        - mountPath: /gitops-tools
          name: gitops-tools

  volumeMounts:
    - mountPath: /gitops-tools
      name: gitops-tools
    - mountPath: /usr/local/sbin/helm
      name: gitops-tools
      subPath: helm
    - mountPath: /helm-secrets-private-keys/
      name: helm-secrets-private-keys

  volumes:
    - emptyDir: {}
      name: gitops-tools
    - name: helm-secrets-private-keys
      secret:
        secretName: helm-secrets-private-keys

server:
  metrics:
    enabled: true
  # Публичный доступ к UI/API (нужен CI для argocd app sync).
  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: argocd.ВАШ_ДОМЕН
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/backend-protocol: HTTP
    tls: true
  config:
    # Без кастомной health-проверки ArgoCD помечает Ingress как Degraded.
    resource.customizations: |
      networking.k8s.io/Ingress:
        health.lua: |
          hs = {}
          hs.status = "Healthy"
          return hs
