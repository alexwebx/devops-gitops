# Secret backend-secret. Цикл по secrets, каждое значение через b64enc (Helm сам
# кодирует в base64). Значения приходят из зашифрованного secrets.yaml (SOPS).
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  {{- range $k, $v := .Values.secrets }}
  {{ $k }}: {{ $v | b64enc | quote }}
  {{- end }}
