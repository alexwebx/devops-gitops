# ШАБЛОН секретов myapp. Скопируй в secrets.yaml, подставь значения, зашифруй SOPS:
#   cp helm/myapp/secrets.example.yaml helm/myapp/secrets.yaml
#   sops -e -i helm/myapp/secrets.yaml
#
# Эти значения попадают в Secret backend-secret (envFrom → backend). Backend
# подключается к базе ими, поэтому DB_USER/DB_PASSWORD ДОЛЖНЫ совпадать с кредами
# в helm/postgres/secrets.yaml.
secrets:
  DB_USER: "todo"
  DB_PASSWORD: "CHANGE_ME_сильный_пароль"
