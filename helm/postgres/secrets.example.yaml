# ШАБЛОН секретов postgres. Скопируй в secrets.yaml, подставь реальные значения и
# зашифруй SOPS (см. README). secrets.yaml коммитится в git ТОЛЬКО зашифрованным.
#
#   cp helm/postgres/secrets.example.yaml helm/postgres/secrets.yaml
#   sops -e -i helm/postgres/secrets.yaml
#
# ВАЖНО: dbUser/dbPassword ДОЛЖНЫ совпадать с secrets.DB_USER/DB_PASSWORD в чарте myapp —
# postgres инициализируется этими кредами, а backend этими же кредами к нему подключается.
secret:
  dbUser: "todo"
  dbPassword: "CHANGE_ME_сильный_пароль"
